# Adjust as needed & rename to 'config.toml'. Leave at project root.
mavlink_endpoint = "/dev/ttyACM0" # use /dev/serial/by-id if possible
baud = 115200
position_source = "GPS_RAW_INT"
bind_address = "0.0.0.0"
tcp_port = 10110
output_rate = 1.0
message_rate = 5.0
valid_age = 2.0
stale_age = 5.0
invalid_age = 5.0
log_level = "INFO"
